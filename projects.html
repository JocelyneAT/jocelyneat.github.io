<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Jocelyne Audrey Tando</title>
  <meta name="description" content="All projects by Jocelyne Audrey Tando: games, 3D environments, UI/UX and animation. Search and filter by category and team or individual work.">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1c1a'/><circle cx='68' cy='34' r='12' fill='%23d9603b'/><path d='M10 70 Q30 62 50 70 T90 70 V100 H10Z' fill='%23f6f3ee'/></svg>">
  <script>
    // Set theme before paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="projects-page">
  <header class="nav-wrap">
    <nav class="nav" aria-label="Main">
      <a href="index.html" class="nav-icon" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      </a>
      <div class="nav-links">
        <a href="index.html#about">About</a>
        <a href="index.html#experience">Experience</a>
        <a href="projects.html" class="active" aria-current="page">Projects</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <span class="nav-sep" aria-hidden="true"></span>
      <a class="nav-btn" href="resume.html">Résumé</a>
      <button class="nav-icon" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main class="container pp">
    <a class="pp-back" href="index.html#projects">← Back to home</a>
    <h1 class="pp-title">Projects</h1>

    <div class="pp-tabs" id="ppTabs" role="tablist" aria-label="Categories"></div>

    <div class="pp-bar">
      <p class="pp-summary" id="ppSummary" aria-live="polite"></p>
      <div class="pp-controls">
        <label class="pp-field"><span>Search</span><input type="search" id="ppSearch" placeholder="Title or tool"></label>
        <label class="pp-field"><span>Collaboration</span>
          <select id="ppCollab"><option value="all">All</option><option value="team">Team project</option><option value="solo">Individual</option></select>
        </label>
      </div>
    </div>

    <div class="pp-grid" id="ppGrid"></div>
    <p class="pp-empty" id="ppEmpty" hidden>No projects match that. <button id="ppReset">Clear filters</button></p>
  </main>

  <footer class="footer container">
    <span>© <span id="year"></span> Jocelyne Audrey Tando</span>
  </footer>

  <!-- Project modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Close">✕</button>
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="projects.js"></script>
</body>
</html>
